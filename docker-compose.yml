services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: bibleget
      POSTGRES_USER: bibleget
      POSTGRES_PASSWORD: bibleget
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./tests/fixtures/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./tests/fixtures/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibleget"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding:
    build:
      context: ./services/embedding
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
    ports:
      - "8001:8000"
    # GPU passthrough: requires the host to have NVIDIA drivers + the NVIDIA
    # Container Toolkit. On a CPU-only host this reservation will prevent the
    # service from starting; override by removing the deploy block locally or
    # running with `docker compose up -d postgres app` (skipping embedding).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: bibleget
      DB_USER: bibleget
      DB_PASS: bibleget
      EMBEDDING_SERVICE_URL: http://embedding:8000

volumes:
  pgdata:
