services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bibleget
      POSTGRES_USER: bibleget
      POSTGRES_PASSWORD: bibleget
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tests/fixtures/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./tests/fixtures/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibleget"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: bibleget
      DB_USER: bibleget
      DB_PASS: bibleget

volumes:
  pgdata:
