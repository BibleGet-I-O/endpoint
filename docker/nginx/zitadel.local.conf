# Local Zitadel behind one origin (http://localhost:${ZITADEL_PORT}), as in
# cdcf-infra production: the v2 login UI under /ui/v2/login, everything else
# to Zitadel. Rendered by nginx's envsubst entrypoint (only ${ZITADEL_PORT}).
# Adapted from CatholicOS/martyrology-frontend docker/nginx/zitadel.local.conf.

# Zitadel picks the instance from the Host header, so 127.0.0.1 and [::1] are
# folded into "localhost" (the instance's only domain), keeping the port.
map $http_host $zitadel_host {
    default                               $http_host;
    "~^127\.0\.0\.1(?<hostport>:\d+)?$"   "localhost$hostport";
    "~^\[::1\](?<hostport>:\d+)?$"        "localhost$hostport";
}

upstream zitadel_backend {
    server zitadel:8080;
}

upstream zitadel_login {
    server zitadel-login:3000;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10m;

    location /ui/v2/login {
        proxy_pass http://zitadel_login;
        proxy_http_version 1.1;
        proxy_set_header Host $zitadel_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $zitadel_host;
        proxy_set_header Connection '';
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:3000 http://localhost:${ZITADEL_PORT}; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' http://zitadel:8080; frame-ancestors 'none'; object-src 'none'" always;
    }

    location / {
        proxy_pass http://zitadel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $zitadel_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $zitadel_host;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
